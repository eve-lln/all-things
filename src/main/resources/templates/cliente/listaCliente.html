    <!DOCTYPE html>
    <html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Lista de Clientes</title>
        <link rel="stylesheet" th:href="@{/stylesheet.css}">
        <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    </head>
    <body>
        <h1>Lista de Clientes</h1>
        <h3><a href="/clientes/criar" class="botao">
            Cadastar Cliente</a></h3>
        <h3><a href="/home" class="botao">
                Voltar à página inicial</a></h3>

        <table>
            <tr>
                <td>Lista de Clientes</td>
            </tr>

        <tr>
            <th>Nome</th>
            <th>Endereço</th>
            <th>Cidade</th>
            <th>Estado</th>
            <th>CEP</th>
            <th>CPF</th>
            <th>RG</th>
            <th>Foto</th>
            <th colspan="2">Ações</th>
        </tr>
        
        <tr th:each="Cliente : ${clientes}">
            <td th:text="${Cliente.nomeCliente}"></td>
            <td th:text="${Cliente.enderecoCliente}"></td>
            <td th:text="${Cliente.cidadeCliente}"></td>
            <td th:text="${Cliente.estadoCliente}"></td>
            <td th:text="${Cliente.cepCliente}"></td>
            <td th:text="${Cliente.cpfCliente}"></td>
            <td th:text="${Cliente.rgCliente}"></td>
            <td>
                <img th:if="${Cliente.fotoCliente != null}"
                th:src="@{/clientes/foto/{id}(id=${Cliente.idCliente})}">
            </td>
            <td>
                <a th:href="@{/clientes/editar/{id}(id=${Cliente.idCliente})}">Editar</a>
                <a th:href="@{/clientes/excluir/{id}(id=${Cliente.idCliente})}">Excluir</a>
                <a></a>
            </td>
        </tr>
        
        </table>
        
    </body>
    </html>
