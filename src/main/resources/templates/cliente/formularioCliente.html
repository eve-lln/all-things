<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Clientes</title>
    <link rel="stylesheet" th:href="@{/stylesheet.css}">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <h1>Cadastro de Clientes</h1>
    <form th:action="@{/clientes/salvar}" method="post" th:object="${cliente}" enctype="multipart/form-data"    >
    <input type="hidden" th:field="*{idCliente}">

        <label for="nomeCliente">Nome</label>
        <input
        type="text"
        id="nomeCliente"
        name="nomeCliente"
        th:field="*{nomeCliente}"
        >

    <label for="enderecoCliente">Endereço</label>
    <input
        type="text"
    id="enderecoCliente"
    name="enderecoCliente"
    th:field="*{enderecoCliente}"
    >

    <label for="cidadeCliente">Cidade</label>
    <input
    type="text"
    id="cidadeCliente"
    name="cidadeCliente"
    th:field="*{cidadeCliente}"
    >

    <label for="estadoCliente">Estado</label>
    <input
    type="text"
    id="estadoCliente"
    name="estadoCliente"
    th:field="*{estadoCliente}"
    >

    <label for="cepCliente">CEP</label>
    <input
    type="text"
    id="cepCliente"
    name="cepCliente"
    th:field="*{cepCliente}"
    >

    <label for="cpfCliente">CPF</label>
    <input
    type="text"
    id="cpfCliente"
    name="cpfCliente"
    th:field="*{cpfCliente}"
    >

    <label for="rgCliente">RG</label>
    <input
    type="text"
    id="rgCliente"
    name="rgCliente"
    th:field="*{rgCliente}"
    >

    <label for="fotoCliente">Foto:</label>
    <input
    type="file"
    id="fotoCliente"
    name="foto"
    accept="image/*"
    >

    <button type="submit">Salvar Cliente</button>

    </form>
    
</body>
</html>
